<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tabelas com Abas + OS por Linha</title>

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-weak: #e8efff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(15,23,42,.06);
      --radius: 16px;
    }
    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
    }

    .viewport{ height: 100vh; display: flex; flex-direction: column; }
    .wrap{ max-width: 100%; width: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .card{
      display: flex; flex-direction: column; min-height: 0; flex: 1;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }

    /* Tabs */
    .tabs{
      display: flex; align-items: center; gap: 4px; padding: 12px;
      border-bottom: 1px solid var(--border); background: #f8fafc;
      position: sticky; top: 0; z-index: 5;
    }
    .tab-btn{
      appearance: none; border: 1px solid transparent; background: transparent;
      color: var(--muted); padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn[aria-selected="true"]{ color: var(--primary); background: var(--primary-weak); border-color: #dbe6ff; }

    .panels{ display: grid; grid-template-columns: 1fr; min-height: 0; flex: 1; }
    .tab-panel{ display: none; padding: 14px; overflow: hidden; }
    .tab-panel.active{ display: block; }

    /* Toolbar */
    .toolbar{ display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .btn{ appearance: none; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 8px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .btn.primary{ border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn.small{ font-size: 12px; padding: 6px 8px; }
    .btn:disabled{ opacity:.6; cursor:not-allowed }
    .muted{ color: var(--muted); font-size: 13px }

    /* Tabela */
    .table-shell{ display: flex; flex-direction: column; min-height: 0; height: 100%; gap: 8px; }
    .table-wrap{
      flex: 1; min-height: 0; overflow: auto;
      border: 1px solid var(--border); border-radius: 12px; background: #fcfdff;
    }
    table{ width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1800px; }
    thead th{
      position: sticky; top: 0; z-index: 2; background: #f8fafc;
      text-align: left; font-size: 12px; letter-spacing: .02em; color: var(--muted);
      border-bottom: 1px solid var(--border); padding: 10px 8px; white-space: nowrap;
    }
    tbody td{
      border-bottom: 1px solid var(--border); padding: 10px 8px; vertical-align: top;
      white-space: nowrap; overflow: visible;
    }
    tbody tr:nth-child(even){ background: #fafcff; }
    td[data-col="Observação"]{ white-space: normal; }

    /* Inputs da tabela */
    .cell-input,
    .cell-select{
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      white-space: nowrap;
    }
    .cell-textarea{
      width: 100%;
      min-height: 64px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      white-space: normal;
    }

    /* Largura mínima p/ evitar corte visual */
    td[data-col="Orçamento enviado"]    { min-width: 160px; }
    td[data-col="Aprovação"]            { min-width: 140px; }
    td[data-col="Molde enviado"]        { min-width: 140px; }
    td[data-col="Recebemos Link de pag."]{ min-width: 200px; }
    td[data-col="Pagamento"]            { min-width: 130px; }
    td[data-col="Previsão"]             { min-width: 130px; }
    td[data-col="Vidros prontos"]       { min-width: 140px; }
    td[data-col="Na empresa"]           { min-width: 130px; }
    td[data-col="Faturamento"]          { min-width: 140px; }
    td[data-col="Forma de pag."]        { min-width: 160px; }
    td[data-col="OS"]                   { min-width: 80px; }

    /* Modal OS */
    .os-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
    .os-modal{width:100%;max-width:720px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:18px;max-height:95vh;overflow:auto}
    .os-title{font-weight:700}
    .os-btn{padding:10px 14px;border-radius:10px;border:none;background:#e5e7eb;cursor:pointer;font:600 14px system-ui}
    .os-btn-primary{background:#2563eb;color:#fff}
    .os-input{width:100%;padding:10px;border-radius:10px;border:1px solid #e5e7eb}
    .os-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .os-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px}
    .os-muted{color:#64748b}
  </style>
</head>
<body>
  <div class="viewport">
    <div class="wrap">
      <div class="card" role="region" aria-label="Tabelas com Abas">
        <div class="tabs" role="tablist" aria-label="Abas de dados">
          <button id="tab-produtos" class="tab-btn" role="tab" aria-selected="true" aria-controls="panel-produtos">Aba de produtos faturados direto</button>
          <button id="tab-resumo" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-resumo">Aba Resumo</button>
        </div>

        <div class="panels">
          <!-- PRODUTOS -->
          <section id="panel-produtos" class="tab-panel active" role="tabpanel" aria-labelledby="tab-produtos">
            <div class="table-shell">
              <div class="toolbar">
                <button class="btn primary" id="btnAtualizar">Atualizar</button>
                <span class="muted">Lista de <code>/api/produtos</code></span>
                <span class="muted" id="status">status: pronto</span>
              </div>

              <div class="table-wrap">
                <table id="tabela-produtos">
                  <thead><tr></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- RESUMO -->
          <section id="panel-resumo" class="tab-panel" role="tabpanel" aria-labelledby="tab-resumo">
            <p class="muted">Resumo em construção…</p>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============ CONFIG ============ */
    const BASE_URL   = 'http://localhost:3000';
    const ENDPOINT_OS = 'https://ulhoa-servico-ec4e1aa95355.herokuapp.com/os'; // ajuste se precisar

    /* ============ COLUNAS ============ */
    // Adicionamos "OS" no final p/ botão da OS por linha
    const COLS_PRODUTOS = [
      "Nº Pedido","Cliente","Fornecedor","Vidro","Tipo","Quantidade",
      "Orçamento enviado","Aprovação","Molde enviado","Recebemos Link de pag.","Pagamento","Previsão",
      "Nº Pedido Fornecedor","Vidros prontos","Na empresa","Faturamento",
      "Responsável / Vendedor","Nº Orç. Fornecedor","Valor Real","Nº Nota Fiscal","Forma de pag.","Observação",
      "OS"
    ];

    const FIELD_BY_COL = {
      "Nº Pedido":"numeroPedido","Cliente":"cliente","Fornecedor":"fornecedor","Vidro":"vidro","Tipo":"tipo","Quantidade":"quantidade",
      "Orçamento enviado":"orcamentoEnviado","Aprovação":"aprovacao","Molde enviado":"moldeEnviado","Recebemos Link de pag.":"recebemosLinkPagamento","Pagamento":"pagamento","Previsão":"previsao",
      "Nº Pedido Fornecedor":"numeroPedidoFornecedor","Vidros prontos":"vidrosProntos","Na empresa":"naEmpresa","Faturamento":"faturamento",
      "Responsável / Vendedor":"responsavelVendedor","Nº Orç. Fornecedor":"numeroOrcFornecedor","Valor Real":"valorReal","Nº Nota Fiscal":"numeroNotaFiscal","Forma de pag.":"formaPagamento","Observação":"observacao"
    };

const EDIT_META = {
  "Quantidade":{type:"number",min:0,step:1},

  // ✅ agora ambos são abertos
  "Fornecedor":{type:"text"},
  "Tipo":{type:"text"},

  "Orçamento enviado":{type:"select",options:["","Sim","Não","Enviado","Pendente"]},
  "Aprovação":{type:"select",options:["","Aprovado","Pendente","Reprovado"]},
  "Molde enviado":{type:"select",options:["","Sim","Não","Pendente"]},
  "Recebemos Link de pag.":{type:"select",options:["","Sim","Não","Pendente"]},
  "Pagamento":{type:"select",options:["","Pendente","Parcial","Pago"]},
  "Previsão":{type:"date"},
  "Nº Pedido Fornecedor":{type:"text"},
  "Nº Orç. Fornecedor":{type:"text"},
  "Nº Nota Fiscal":{type:"text"},
  "Forma de pag.":{type:"select",options:["","PIX","Crédito","Débito","Boleto","Dinheiro","Transferência"]},
  "Vidros prontos":{type:"select",options:["","Sim","Não","Parcial"]},
  "Na empresa":{type:"select",options:["","Sim","Não"]},
  "Faturamento":{type:"select",options:["","Pendente","Parcial","Faturado"]},
  "Observação":{type:"textarea"}
};


    /* ============ HELPERS ============ */
    const $ = (s, root=document)=> root.querySelector(s);
    const setStatus = (txt)=> { const el = $('#status'); if (el) el.textContent = 'status: ' + txt; };

    function numberToBRL(n){
      return (new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"})
        .format(Number(n||0)));
    }

    function brlToNumber(str){
      if (typeof str === 'number') return str;
      if (!str) return 0;
      return Number(String(str).replace(/[^\d,-]/g,'').replace('.','').replace(',','.')) || 0;
    }

    function getNumeroOrcamento(){
      const el = document.getElementById('numeroOrcamento');
      return (el?.value || el?.textContent || '').trim();
    }

    function getCodigoCliente(){
      // tenta pegar do campo oficial se existir
      const el = document.querySelector('#clientesWrapper .cliente-item .codigoCliente');
      const v = (el?.value || el?.textContent || '').trim();
      return v || '';
    }

    function getRazaoSocial(){
      const exato = document.querySelector(
        '#clientesWrapper > div > div.col-md-6.position-relative.d-flex.align-items-end.gap-2 > div > input.razaoSocial'
      );
      if (exato?.value?.trim()) return exato.value.trim();
      if (exato?.dataset?.valorOriginal?.trim()) return exato.dataset.valorOriginal.trim();
      const fallback = document.querySelector('#clientesWrapper .cliente-item .razaoSocial');
      return (fallback?.value?.trim() || fallback?.dataset?.valorOriginal?.trim() || '').trim();
    }

    /* ============ TABELA ============ */
    function setColumns(){
      const tr=document.querySelector(`#tabela-produtos thead tr`); tr.innerHTML='';
      COLS_PRODUTOS.forEach(h=>{ const th=document.createElement('th'); th.textContent=h; tr.appendChild(th); });
    }

    async function putField(id,field,value){
      const payload={}; payload[field]=value;
      const res=await fetch(`${BASE_URL}/api/produtos/${id}`,{
        method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
      });
      const j=await res.json(); if(!j.ok) throw new Error(j.error||'Erro'); return j.data;
    }

    function renderDocs(docs){
      const tbody=document.querySelector(`#tabela-produtos tbody`); tbody.innerHTML='';
      const frag = document.createDocumentFragment();

      docs.forEach(doc=>{
        const tr=document.createElement('tr'); tr.dataset.id=doc._id||'';

        COLS_PRODUTOS.forEach(col=>{
          const td=document.createElement('td'); td.setAttribute('data-col',col);

          if (col === 'OS'){
            const btn = document.createElement('button');
            btn.className = 'btn small';
            btn.textContent = 'OS';
            btn.title = 'Criar Ordem de Serviço com o valor desta linha';
            btn.onclick = ()=> openOsPopupForRow(doc);
            td.appendChild(btn);
            tr.appendChild(td);
            return;
          }

          const field=FIELD_BY_COL[col];
          const value=doc[field];
          const meta=EDIT_META[col];

          if(!meta){ // somente leitura
            // formato de moeda em "Valor Real"
            if (col === 'Valor Real'){
              td.textContent = numberToBRL(value || 0);
            } else {
              // data bonitinha
              if (col === 'Previsão' && value){
                const d = new Date(value);
                if (!isNaN(d)) {
                  const dd = String(d.getDate()).padStart(2,'0');
                  const mm = String(d.getMonth()+1).padStart(2,'0');
                  const yy = d.getFullYear();
                  td.textContent = `${dd}/${mm}/${yy}`;
                } else {
                  td.textContent = value ?? '';
                }
              } else {
                td.textContent = value ?? '';
              }
            }
          } else {
            const commit = async (newVal)=>{
              try { await putField(tr.dataset.id, field, newVal); }
              catch(e){ alert(e.message); }
            };

            if(meta.type==='textarea'){
              const ta=document.createElement('textarea');
              ta.className='cell-textarea'; ta.value=value??'';
              ta.onchange=e=>commit(e.target.value);
              td.appendChild(ta);

            }else if(meta.type==='select'){
              const sel=document.createElement('select'); sel.className='cell-select';
              (meta.options||[]).forEach(opt=>{
                const o=document.createElement('option'); o.value=opt; o.textContent=opt; sel.appendChild(o);
              });
              sel.value=value??''; sel.onchange=e=>commit(e.target.value);
              td.appendChild(sel);

            }else if(meta.type==='date'){
              const inp=document.createElement('input'); inp.type='date'; inp.className='cell-input';
              if(value){ const d=new Date(value);
                inp.value=!isNaN(d)?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
              }
              inp.onchange=e=>commit(e.target.value?new Date(e.target.value).toISOString():null);
              td.appendChild(inp);

            }else{
              const inp=document.createElement('input');
              inp.type=meta.type; if(meta.min!=null) inp.min=meta.min; if(meta.step!=null) inp.step=meta.step;
              inp.className='cell-input';
              inp.value=(col==='Valor Real') ? (value ?? 0) : (value ?? '');
              inp.onchange=e=>{
                let v = e.target.value;
                if(col==='Valor Real'){ v = Number(v)||0; }
                commit(v);
              };
              td.appendChild(inp);
            }
          }

          tr.appendChild(td);
        });

        frag.appendChild(tr);
      });

      tbody.appendChild(frag);
    }

    async function carregarProdutos(){
      setStatus('carregando…');
      try{
        const res=await fetch(BASE_URL+'/api/produtos?limit=1000');
        const j=await res.json();
        if(!j.ok) throw new Error(j.error||'Falha ao listar');
        renderDocs(j.data || []);
        setStatus(`ok — ${(j.data||[]).length} registro(s)`);
      }catch(err){
        console.error(err);
        setStatus('erro: '+err.message);
        alert('Erro ao carregar: '+err.message);
      }
    }

    /* ============ OS POPUP POR LINHA ============ */
    function openOsPopupForRow(doc){
      // monta descrição amigável com campos da linha
      const desc = [doc?.vidro, doc?.tipo].filter(Boolean).join(' • ') || 'Serviço';
      const valor = Number(doc?.valorReal) || 0;
      const clienteCodigo = getCodigoCliente();
      const numeroOrcamento = getNumeroOrcamento();

      openOsPopup({
        endpoint: ENDPOINT_OS,
        lines: [{ descricao: desc, valorBRL: numberToBRL(valor), desconto: '0', qtd: '1' }],
        cCodIntOS: numeroOrcamento,
        nCodCli: clienteCodigo
      });
    }

    /* ============ POPUP OS (1+ linhas, pré-preenchida pela linha) ============ */
    async function openOsPopup({ endpoint = ENDPOINT_OS, lines = [], cCodIntOS = '', nCodCli = '' } = {}) {
      const valorFinalTotalEl = document.getElementById('valorFinalTotal'); // se existir na tela
      const valorTela = valorFinalTotalEl ? valorFinalTotalEl.textContent.trim() : 'R$ 0,00';

      // Backdrop + modal
      const backdrop = document.createElement('div');
      backdrop.className = 'os-backdrop';
      backdrop.setAttribute('aria-hidden','true');
      backdrop.innerHTML = `
        <div class="os-modal" role="dialog" aria-modal="true" aria-labelledby="os-title">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 class="os-title" id="os-title">Ordem de Serviço</h3>
            <button class="os-btn" id="os-close" type="button">Fechar</button>
          </div>

          <div class="os-row">
            <div>
              <label>Número do orçamento (cCodIntOS)</label>
              <input class="os-input" id="os-cCodIntOS" value="${cCodIntOS || getNumeroOrcamento()}">
            </div>
            <div>
              <label>Código do cliente (nCodCli)</label>
              <input class="os-input" id="os-nCodCli" value="${nCodCli || getCodigoCliente()}">
            </div>
          </div>

          <div class="os-row" style="margin-top:12px">
            <div>
              <label>Quantidade de parcelas (nQtdeParc)</label>
              <input class="os-input" id="os-nQtdeParc" type="number" min="1" step="1" value="1">
            </div>
            <div>
              <label>Data de previsão (DD/MM/AAAA) (dDtPrevisao)</label>
              <input class="os-input" id="os-dDtPrevisao" value="">
            </div>
          </div>

          <div style="margin-top:12px">
            <label>Observações da NF (cDadosAdicNF)</label>
            <input class="os-input" id="os-cDadosAdicNF" value="OS incluída via API • Orçamento ${cCodIntOS || getNumeroOrcamento()}">
          </div>

          <div class="os-card" style="margin-top:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div class="os-title">Serviços Prestados</div>
              <button class="os-btn" id="os-add-line" type="button">+ Adicionar linha</button>
            </div>
            <div class="os-muted" style="margin:6px 0">
              Cada linha será enviada como um item em <code>ServicosPrestados</code> com seu próprio valor final (desconto e quantidade por linha).
            </div>
            <div class="os-lines-wrap" id="os-lines-wrap" style="display:grid;gap:8px;margin-top:8px"></div>
            <div style="display:flex;justify-content:flex-end;margin-top:10px">
              <div style="font:600 14px system-ui;color:#334155">
                Total (soma dos finais): <b id="os-total-geral">R$ 0,00</b>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
            <button class="os-btn" id="os-cancel" type="button">Cancelar</button>
            <button class="os-btn os-btn-primary" id="os-submit" type="button">Enviar OS</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      Object.assign(backdrop.style,{display:"flex"});

      // refs
      const btnClose   = $("#os-close", backdrop);
      const btnCancel  = $("#os-cancel", backdrop);
      const btnSubmit  = $("#os-submit", backdrop);
      const btnAddLine = $("#os-add-line", backdrop);
      const inpCodInt  = $("#os-cCodIntOS", backdrop);
      const inpCli     = $("#os-nCodCli", backdrop);
      const inpParc    = $("#os-nQtdeParc", backdrop);
      const inpData    = $("#os-dDtPrevisao", backdrop);
      const inpAdicNF  = $("#os-cDadosAdicNF", backdrop);
      const linesWrap  = $("#os-lines-wrap", backdrop);
      const totalGeralEl = $("#os-total-geral", backdrop);

      const closeAll = ()=>{ backdrop.remove(); };

      btnClose.onclick = closeAll;
      btnCancel.onclick = closeAll;
      backdrop.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

      function createLine({ descricao='', valorBRL='R$ 0,00', desconto='0', qtd='1' } = {}){
        const row = document.createElement('div');
        row.className = 'os-line';
        row.style.display = 'grid';
        row.style.gridTemplateColumns = '2fr 1fr 1fr 1fr 1fr auto';
        row.style.gap = '8px';
        row.style.alignItems = 'center';

        // normaliza o valor para exibir sempre com R$
        const valTxt = String(valorBRL).includes('R$') ? valorBRL : numberToBRL(Number(String(valorBRL).replace(',','.')));

        row.innerHTML = `
          <input class="os-desc os-input" placeholder="Descrição (opcional)" value="${descricao}">
          <input class="os-valor os-input" inputmode="decimal" value="${valTxt}">
          <input class="os-descp os-input" type="number" step="0.01" value="${desconto}">
          <input class="os-qtd os-input" type="number" min="1" step="1" value="${qtd}">
          <input class="os-final os-input" readonly style="background:#f8fafc">
          <button type="button" class="os-del os-btn" title="Remover">×</button>
        `;

        const elValor = $(".os-valor", row);
        const elDescP = $(".os-descp", row);
        const elQtd   = $(".os-qtd", row);
        const elFinal = $(".os-final", row);

        const _toNum = (txt)=>{
          if (!txt) return 0;
          // remove R$ e separadores
          let s = String(txt).replace(/[^\d.,-]/g,'');
          const last = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
          let i=s,f=""; if(last>=0){ i=s.slice(0,last); f=s.slice(last+1); }
          i=i.replace(/[^\d-]/g,''); f=f.replace(/[^\d]/g,'');
          const n = Number(i + (f ? '.'+f : ''));
          return isNaN(n) ? 0 : n;
        };

        const _fmt = (n)=> numberToBRL(n);

        function calcLine(){
          const base = _toNum(elValor.value);
          const p = Number(elDescP.value)||0;
          const q = Math.max(1, Number(elQtd.value)||1);
          const finalUnit = base * (1 - p/100);
          const finalTotal = finalUnit * q;
          elFinal.value = _fmt(finalTotal);
          calcTotalGeral();
        }

        elValor.addEventListener('input', calcLine);
        elDescP.addEventListener('input', calcLine);
        elQtd.addEventListener('input', calcLine);
        $(".os-del", row).addEventListener('click', ()=>{ row.remove(); calcTotalGeral(); });

        linesWrap.appendChild(row);
        calcLine();
      }

      function calcTotalGeral(){
        let soma = 0;
        linesWrap.querySelectorAll(".os-line .os-final").forEach(inp=>{
          soma += brlToNumber(inp.value);
        });
        totalGeralEl.textContent = numberToBRL(soma);
      }

      // se não vierem linhas, cria uma com o total da tela
      if (!Array.isArray(lines) || !lines.length){
        lines = [{ descricao: 'Serviço', valorBRL: valorTela, desconto: '0', qtd: '1' }];
      }
      lines.forEach(l => createLine(l));
      btnAddLine.addEventListener('click', ()=> createLine({ descricao:'', valorBRL:'R$ 0,00', desconto:'0', qtd:'1' }));

      // Enviar
      btnSubmit.onclick = async ()=>{
        const missing = [];
        if (!inpCodInt.value) missing.push("Número do orçamento (cCodIntOS)");
        if (!inpCli.value)    missing.push("Código do cliente (nCodCli)");
        if (!(Number(inpParc.value) > 0)) missing.push("Quantidade de parcelas (nQtdeParc)");
        if (!linesWrap.querySelector('.os-line')) missing.push("Pelo menos uma linha de serviço");

        if (missing.length){
          alert("Preencha: " + missing.join(", "));
          return;
        }

        // coleta linhas
        const servicos = [];
        linesWrap.querySelectorAll(".os-line").forEach(row=>{
          const valorTxt = row.querySelector('.os-valor').value;
          const descPct  = Number(row.querySelector('.os-descp').value) || 0;
          const qtd      = Math.max(1, Number(row.querySelector('.os-qtd').value) || 1);
          const base = brlToNumber(valorTxt);
          const finalUnit = base * (1 - descPct/100); // VALOR UNITÁRIO FINAL
          if (!(finalUnit > 0)) return;

          servicos.push({
            cCodServLC116: "7.01",
            cCodServMun:   "0701-0/01-88",
            cRetemISS:     "N",
            cTribServ:     "01",
            impostos: { cRetemIRRF:"N", cRetemPIS:"N", nAliqIRRF:0, nAliqISS:0, nAliqPIS:0 },
            nQtde: qtd,
            nValUnit: finalUnit
          });
        });

        if (!servicos.length){
          alert("Todas as linhas ficaram com valor final zero.");
          return;
        }

        const payload = {
          Cabecalho: {
            cCodIntOS: String(inpCodInt.value).trim(),
            cCodParc: "999",
            cEtapa: "20",
            dDtPrevisao: String(inpData.value || '').trim(),
            nCodCli: Number(inpCli.value),
            nQtdeParc: Number(inpParc.value)
          },
          Departamentos: [],
          Email: { cEnvBoleto:"N", cEnvLink:"N", cEnviarPara:"" },
          InformacoesAdicionais: {
            cCodCateg: "1.02.02",
            cDadosAdicNF: String(inpAdicNF.value).trim(),
            nCodCC: 10937506623
          },
          ServicosPrestados: servicos
        };

        try{
          const resp = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          alert(data.ok ? "OS enviada com sucesso!" : ("Falha: " + (data.error || "Erro")));
          closeAll();
        }catch(err){
          alert("Erro de conexão: " + (err?.message || err));
          closeAll();
        }
      };
    }

    /* ============ BOOT ============ */
    document.getElementById('btnAtualizar').onclick = carregarProdutos;
    window.onload = ()=>{ setColumns(); carregarProdutos(); };
  </script>
</body>
</html>
